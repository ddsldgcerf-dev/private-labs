<!doctype html>
<html lang="ar" dir="rtl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>تسجيل الدخول</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f4f6f8;
    font-family:Arial,sans-serif;
}

.login-card{
    width:90%;
    max-width:430px;
    background:#fff;
    padding:32px;
    border-radius:18px;
    box-shadow:0 8px 30px #0002;
}

h1{
    margin-top:0;
    text-align:center;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin-top:7px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:25px;
    padding:13px;
    border:0;
    border-radius:9px;
    background:#146c43;
    color:#fff;
    font-size:17px;
    cursor:pointer;
}

.error{
    background:#fdecea;
    color:#b3261e;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
}

</style>
</head>

<body>

<div class="login-card">

<h1>الدخول إلى النظام</h1>

<div class="subtitle">
قاعدة بيانات المخابر الخاصة
</div>

{% if error %}
<div class="error">
{{ error }}
</div>
{% endif %}

<form method="post" action="/login">

<label>اسم المستخدم</label>

<input
    type="text"
    name="username"
    required
    autocomplete="username"
>

<label>كلمة المرور</label>

<input
    type="password"
    name="password"
    required
    autocomplete="current-password"
>

<button type="submit">
دخول
</button>

</form>

</div>

</body>
</html>
